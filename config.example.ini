# Stream Deck XL IP camera config.
# Copy to ~/.config/streamdeck-camera/config.ini and edit.

[camera]
# Easiest: a full RTSP URL. Wins over host/user/pass if both are set.
# rtsp_url = rtsp://user:pass@192.168.1.10:554/stream2

# Or build the URL piecemeal:
host = 192.168.1.10
user = camera_user
pass = camera_pass
port = 554
stream = stream2

# Source resolution. Optional — the script auto-detects via ffprobe on
# startup. Set explicitly if probing is slow or your camera misreports.
# src_width = 640
# src_height = 360
